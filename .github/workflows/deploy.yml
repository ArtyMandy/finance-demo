name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npx ng build --base-href /finance-demo/

      # GitHub Pages has no SPA fallback; serve index.html for unknown routes
      - name: Add 404 fallback
        run: cp dist/finance-demo/browser/index.html dist/finance-demo/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/finance-demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
