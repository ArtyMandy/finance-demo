name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # On failure, the end of the output is also shown as an annotation on the PR.
      - name: Build
        run: bash .github/annotate-failure.sh "ng build" npx ng build

      - name: Test
        run: bash .github/annotate-failure.sh "ng test" npx ng test --watch=false
