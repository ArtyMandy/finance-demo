name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npx ng build

      # On failure, the end of the output is also shown as an annotation on the PR.
      - name: Test
        run: |
          set -o pipefail
          npx ng test --watch=false 2>&1 | tee test-output.txt || {
            tail -c 30000 test-output.txt | sed 's/\x1b\[[0-9;]*m//g' \
              | awk 'BEGIN { printf "::error title=ng test failed::" }
                     { gsub(/%/, "%25"); printf "%s%%0A", $0 } END { print "" }'
            exit 1
          }
